<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLED Satranç Studio</title>
  
  <!-- Modern Tipografi (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Chessboard.js CSS -->
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  
  <style>
    :root {
      --bg-main: #050505;
      --bg-card: #0e0e11;
      --bg-card-hover: #16161c;
      --border-color: #1e1e24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --text-main: #f3f4f6;
      --text-muted: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
    }

    /* LOBİ EKRANI */
    #lobby-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 36px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      width: 380px;
      max-width: 95vw;
    }

    #lobby-screen h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 24px;
      color: var(--text-main);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-bottom: 24px;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="text"] {
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #141418;
      color: white;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #3b82f6;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s, background-color 0.2s;
    }

    .action-btn:hover {
      background: #e5e7eb;
      transform: translateY(-1px);
    }

    /* OYUN EKRANI */
    #game-screen {
      display: none;
      flex-direction: row;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }

    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: 1;
      width: 100%;
      max-width: 440px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 12px;
    }

    .room-badge {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .room-badge strong {
      color: var(--text-main);
      font-weight: 700;
    }

    .copy-btn {
      background: #1e1e24;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: #2a2a32;
    }

    /* SAYAÇ KARTLARI */
    .timer-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }

    .timer-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 12px;
      transition: border-color 0.3s;
    }

    .timer-card.active {
      border-color: var(--accent-green);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.15);
    }

    .player-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .timer {
      font-size: 1.3rem;
      font-weight: 700;
      font-family: monospace;
      color: var(--text-main);
    }

    .status-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      min-height: 24px;
    }

    /* YENEN TAŞLAR PANELLERİ */
    .captured-pieces {
      width: 100%;
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 8px;
    }

    .captured-pieces img {
      width: 22px;
      height: 22px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .score-diff {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-main);
      background: #22222a;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: auto;
    }

    /* TAHTA VE STİLİ */
    #board {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 50px rgba(0,0,0,0.9);
      user-select: none;
    }

    .square-55d63 {
      cursor: pointer;
    }

    .white-1e1d3 {
      background-color: #383b42 !important;
      color: #383b42;
    }

    .black-3c85d {
      background-color: #1c1d21 !important;
      color: #1c1d21;
    }

    .highlight-move {
      box-shadow: inset 0 0 0 1000px rgba(255, 215, 0, 0.28) !important;
    }

    /* SEÇİLİ TAŞ KARESE VURGUSU */
    .selected-square {
      background-color: rgba(59, 130, 246, 0.4) !important;
    }

    /* ŞAH ÇEKİLME / MAT KIRMIZI PARLAMA EFEKTİ */
    .check-square {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.9) 0%, rgba(220, 38, 38, 0.6) 50%, rgba(185, 28, 28, 0) 85%) !important;
      box-shadow: inset 0 0 12px rgba(239, 68, 68, 0.8) !important;
    }

    .legal-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 26%;
      height: 26%;
      background-color: rgba(34, 197, 94, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }

    .legal-capture::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 5px solid rgba(34, 197, 94, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
      background-color: transparent !important;
    }

    /* HAMLE GEÇMİŞİ PANELİ */
    .move-history-panel {
      width: 260px;
      height: 580px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .history-list::-webkit-scrollbar {
      width: 6px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }

    .move-row {
      display: flex;
      padding: 6px 8px;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 6px;
    }

    .move-row:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    .move-num {
      width: 36px;
      color: var(--text-muted);
    }

    .move-white, .move-black {
      flex: 1;
      color: var(--text-main);
    }

    /* KONTROL BUTONLARI */
    .control-buttons {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-card);
      color: var(--text-main);
    }

    .btn:hover {
      background: var(--bg-card-hover);
    }

    .btn-resign:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .btn-restart:hover {
      border-color: var(--accent-orange);
      color: var(--accent-orange);
    }

    @media (max-width: 768px) {
      #game-screen {
        flex-direction: column;
        align-items: center;
      }

      .move-history-panel {
        width: 100%;
        max-width: 440px;
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <!-- LOBİ EKRANI -->
  <div id="lobby-screen">
    <h2>STUDIO CHESS</h2>
    
    <div class="input-group">
      <label>Oda Kodu</label>
      <input type="text" id="room-input" placeholder="Rastgele Veya Kod Girin" maxlength="10">
    </div>

    <button class="action-btn" onclick="joinGame()">Odaya Katıl</button>
  </div>

  <!-- OYUN EKRANI -->
  <div id="game-screen">
    
    <div class="board-container">
      <div class="top-bar">
        <div class="room-badge">Oda Kodu: <strong id="display-room-id">-</strong></div>
        <button class="copy-btn" onclick="copyInviteLink()">Davet Linki</button>
      </div>

      <div class="timer-container">
        <div id="black-timer-card" class="timer-card">
          <span class="player-label">Siyah</span>
          <span id="black-timer" class="timer">10:00</span>
        </div>
        <div id="white-timer-card" class="timer-card">
          <span class="player-label">Beyaz</span>
          <span id="white-timer" class="timer">10:00</span>
        </div>
      </div>

      <div id="status" class="status-text">Oyuncu bekleniyor...</div>

      <div id="top-captured" class="captured-pieces"></div>

      <div id="board"></div>

      <div id="bottom-captured" class="captured-pieces"></div>

      <div class="control-buttons">
        <button class="btn btn-resign" onclick="resignGame()">Pes Et</button>
        <button class="btn btn-restart" onclick="restartGame()">Yeniden Başlat</button>
      </div>
    </div>

    <div class="move-history-panel">
      <div class="panel-header">
        <span>Hamle Geçmişi</span>
        <span id="move-count" style="font-size:0.75rem; color:var(--text-muted);">0 Hamle</span>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    const game = new Chess();
    let board = null;
    let myRole = null;
    let currentRoomId = '';
    let selectedSquare = null; // Tıklama takibi için seçili kare

    const moveSound = new Audio('https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/standard/Move.mp3');
    const captureSound = new Audio('https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/standard/Capture.mp3');

    const pieceValues = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
    const startingPieces = { p: 8, n: 2, b: 2, r: 2, q: 1, k: 1 };

    function pieceTheme(piece) {
      return 'https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/alpha/' + piece + '.svg';
    }

    function playSound(isCapture) {
      if (isCapture) {
        captureSound.currentTime = 0;
        captureSound.play().catch(() => {});
      } else {
        moveSound.currentTime = 0;
        moveSound.play().catch(() => {});
      }
    }

    function removeHighlights() {
      $('#board .square-55d63').removeClass('highlight-move check-square selected-square');
    }

    function highlightSquare(square) {
      $('#board .square-' + square).addClass('highlight-move');
    }

    function removeGreySquares() {
      $('#board .square-55d63').removeClass('legal-dot legal-capture');
    }

    function greySquare(square, isCapture) {
      const $square = $('#board .square-' + square);
      if (isCapture) {
        $square.addClass('legal-capture');
      } else {
        $square.addClass('legal-dot');
      }
    }

    // Şah karelerini bulup kırmızı parlama efekti uygulama
    function highlightCheck() {
      if (game.in_check() || game.in_checkmate()) {
        const turn = game.turn();
        const currentBoard = game.board();

        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const piece = currentBoard[row][col];
            if (piece && piece.type === 'k' && piece.color === turn) {
              const file = String.fromCharCode(97 + col);
              const rank = 8 - row;
              const kingSquare = file + rank;
              $('#board .square-' + kingSquare).addClass('check-square');
              return;
            }
          }
        }
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
      document.getElementById('room-input').value = roomParam.toUpperCase();
    }

    function generateRoomId() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function joinGame() {
      const inputVal = document.getElementById('room-input').value.trim();
      currentRoomId = inputVal !== '' ? inputVal.toUpperCase() : generateRoomId();

      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById('display-room-id').innerText = currentRoomId;

      socket.emit('joinRoom', currentRoomId);
      initBoard();
    }

    function copyInviteLink() {
      const inviteUrl = window.location.origin + '?room=' + currentRoomId;
      navigator.clipboard.writeText(inviteUrl).then(() => {
        alert('Davet linki kopyalandı! Arkadaşınla paylaşabilirsin:\n' + inviteUrl);
      });
    }

    function resignGame() {
      if (myRole === 's') return;
      if (confirm('Pes etmek istediğinize emin misiniz?')) {
        socket.emit('resign');
      }
    }

    function restartGame() {
      if (confirm('Oyunu yeniden başlatmak istediğinize emin misiniz?')) {
        socket.emit('restartGame');
      }
    }

    socket.on('playerRole', (role) => {
      myRole = role;
      updateStatus();
      if (board) board.orientation(myRole === 'b' ? 'black' : 'white');
    });

    socket.on('spectatorRole', () => {
      myRole = 's';
      document.getElementById('status').innerText = 'Oda dolu (İzleyici Modu)';
    });

    socket.on('gameStatus', (msg) => {
      document.getElementById('status').innerText = msg;
    });

    socket.on('boardState', (data) => {
      const fenChanged = data.fen !== game.fen();
      game.load(data.fen);
      if (board) board.position(data.fen, true);

      selectedSquare = null; // Yeni tahta durumunda seçimi sıfırla
      updateStatus();
      updateTimers(data.whiteTime, data.blackTime, game.turn());
      updateCapturedPieces();
      updateMoveHistory();

      removeHighlights();
      removeGreySquares();
      if (data.lastMove) {
        highlightSquare(data.lastMove.from);
        highlightSquare(data.lastMove.to);
      }

      highlightCheck();

      if (fenChanged && data.lastMove) {
        playSound(!!data.lastMove.captured);
      }
    });

    socket.on('timerUpdate', (data) => {
      updateTimers(data.whiteTime, data.blackTime, data.turn);
    });

    socket.on('gameOver', (msg) => {
      alert(msg);
      document.getElementById('status').innerText = msg;
    });

    function updateMoveHistory() {
      const history = game.history();
      const listContainer = document.getElementById('history-list');
      document.getElementById('move-count').innerText = `${history.length} Hamle`;

      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const whiteMove = history[i] || '';
        const blackMove = history[i + 1] || '';

        html += `
          <div class="move-row">
            <span class="move-num">${moveNum}.</span>
            <span class="move-white">${whiteMove}</span>
            <span class="move-black">${blackMove}</span>
          </div>
        `;
      }

      listContainer.innerHTML = html;
      listContainer.scrollTop = listContainer.scrollHeight;
    }

    function updateCapturedPieces() {
      const currentBoard = game.board();
      const currentCounts = {
        w: { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 },
        b: { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 }
      };

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = currentBoard[row][col];
          if (piece) {
            currentCounts[piece.color][piece.type]++;
          }
        }
      }

      const capturedByWhite = [];
      const capturedByBlack = [];
      let whiteScore = 0;
      let blackScore = 0;

      ['p', 'n', 'b', 'r', 'q'].forEach(type => {
        const missingBlack = startingPieces[type] - currentCounts.b[type];
        for (let i = 0; i < missingBlack; i++) {
          capturedByWhite.push('b' + type.toUpperCase());
          whiteScore += pieceValues[type];
        }

        const missingWhite = startingPieces[type] - currentCounts.w[type];
        for (let i = 0; i < missingWhite; i++) {
          capturedByBlack.push('w' + type.toUpperCase());
          blackScore += pieceValues[type];
        }
      });

      const topDiv = document.getElementById('top-captured');
      const bottomDiv = document.getElementById('bottom-captured');

      topDiv.innerHTML = '';
      bottomDiv.innerHTML = '';

      const isBlackPlayer = myRole === 'b';
      const topPieces = isBlackPlayer ? capturedByBlack : capturedByWhite;
      const bottomPieces = isBlackPlayer ? capturedByWhite : capturedByBlack;

      topPieces.forEach(p => {
        topDiv.innerHTML += `<img src="${pieceTheme(p)}" alt="${p}">`;
      });
      bottomPieces.forEach(p => {
        bottomDiv.innerHTML += `<img src="${pieceTheme(p)}" alt="${p}">`;
      });

      const scoreDiff = whiteScore - blackScore;
      if (scoreDiff !== 0) {
        const diffText = scoreDiff > 0 ? `+${scoreDiff}` : `+${Math.abs(scoreDiff)}`;
        if ((scoreDiff > 0 && !isBlackPlayer) || (scoreDiff < 0 && isBlackPlayer)) {
          bottomDiv.innerHTML += `<span class="score-diff">${diffText}</span>`;
        } else {
          topDiv.innerHTML += `<span class="score-diff">${diffText}</span>`;
        }
      }
    }

    function updateTimers(wTime, bTime, turn) {
      document.getElementById('white-timer').innerText = formatTime(wTime);
      document.getElementById('black-timer').innerText = formatTime(bTime);
      
      document.getElementById('white-timer-card').classList.toggle('active', turn === 'w');
      document.getElementById('black-timer-card').classList.toggle('active', turn === 'b');
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function showLegalMoves(square) {
      removeGreySquares();
      const moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;

      for (let i = 0; i < moves.length; i++) {
        const isCapture = !!moves[i].captured;
        greySquare(moves[i].to, isCapture);
      }
    }

    // TIKLAYARAK OYNAMA MANTIĞI (CLICK-TO-MOVE)
    function handleSquareClick(square) {
      if (game.game_over() || myRole === 's') return;
      if ((game.turn() === 'w' && myRole !== 'w') || (game.turn() === 'b' && myRole !== 'b')) return;

      const pieceOnSquare = game.get(square);

      // 1. Durum: Henüz hiçbir taş seçilmediyse
      if (!selectedSquare) {
        if (pieceOnSquare && pieceOnSquare.color === game.turn()) {
          selectedSquare = square;
          $('#board .square-' + square).addClass('selected-square');
          showLegalMoves(square);
        }
        return;
      }

      // 2. Durum: Zaten bir taş seçilmişken tekrar aynı kareye tıklanırsa seçimi iptal et
      if (selectedSquare === square) {
        selectedSquare = null;
        $('#board .square-55d63').removeClass('selected-square');
        removeGreySquares();
        return;
      }

      // 3. Durum: Seçili bir taş varken kendi başka bir taşına tıklanırsa seçimi değiştir
      if (pieceOnSquare && pieceOnSquare.color === game.turn()) {
        $('#board .square-55d63').removeClass('selected-square');
        selectedSquare = square;
        $('#board .square-' + square).addClass('selected-square');
        showLegalMoves(square);
        return;
      }

      // 4. Durum: Seçili taş ile tıklanan kareye hamle yapmayı dene
      const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });

      if (move === null) {
        // Geçersiz bir kareye tıklandıysa seçimi sıfırla
        selectedSquare = null;
        $('#board .square-55d63').removeClass('selected-square');
        removeGreySquares();
      } else {
        // Hamle geçerliyse sunucuya bildir
        const fromSquare = selectedSquare;
        selectedSquare = null;
        
        removeGreySquares();
        removeHighlights();
        highlightSquare(fromSquare);
        highlightSquare(square);
        highlightCheck();

        board.position(game.fen());
        socket.emit('move', { from: fromSquare, to: square, promotion: 'q' });
      }
    }

    function updateStatus() {
      let statusText = '';
      const turnName = game.turn() === 'w' ? 'Beyaz' : 'Siyah';

      if (game.in_checkmate()) {
        statusText = `Şah Mat! Kazanan: ${turnName === 'Beyaz' ? 'Siyah' : 'Beyaz'}`;
      } else if (game.in_draw()) {
        statusText = 'Oyun Berabere!';
      } else {
        statusText = `Hamle Sırası: ${turnName}`;
        if (game.in_check()) statusText += ' (ŞAH!)';
        if (myRole === 'w') statusText += ' • Sen: Beyaz';
        if (myRole === 'b') statusText += ' • Sen: Siyah';
      }
      document.getElementById('status').innerText = statusText;
    }

    function initBoard() {
      if (board) return;

      board = Chessboard('board', {
        draggable: false, // Sürüklemeyi kapattık, tıklayarak oynama aktif
        position: 'start',
        orientation: myRole === 'b' ? 'black' : 'white',
        pieceTheme: pieceTheme
      });

      // Karelere tıklama olayını dinle
      $('#board').on('click', '.square-55d63', function () {
        const square = $(this).attr('data-square');
        handleSquareClick(square);
      });
    }
  </script>
</body>
</html>
