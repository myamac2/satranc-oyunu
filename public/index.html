<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Online Satranç</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; background-color: #121212; color: #fff;
    }

    #lobby-screen {
      display: flex; flex-direction: column; align-items: center;
      background: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      width: 360px; max-width: 90vw;
    }
    .input-group { display: flex; flex-direction: column; gap: 10px; width: 100%; margin-bottom: 20px; }
    input[type="text"] {
      padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: white;
      text-align: center; font-size: 1rem; font-weight: bold; text-transform: uppercase;
    }
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-bottom: 15px; }
    .theme-btn {
      padding: 12px; border: 2px solid #333; background: #2a2a2a; color: white;
      border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s; font-size: 0.85rem;
    }
    .theme-btn.selected { border-color: #4CAF50; background: #333; }

    .action-btn {
      width: 100%; padding: 14px; background: #4CAF50; color: white; border: none;
      border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s;
    }
    .action-btn:hover { background: #45a049; }

    #game-screen { display: none; flex-direction: column; align-items: center; }
    
    .room-bar {
      display: flex; align-items: center; gap: 10px; background: #2a2a2a;
      padding: 8px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 0.9rem;
    }
    .copy-btn {
      background: #2196F3; color: white; border: none; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.8rem;
    }

    .timer-container {
      display: flex; justify-content: space-between; width: 400px; max-width: 90vw;
      margin: 10px 0; padding: 10px 15px; background: #2a2a2a; border-radius: 8px;
    }
    .timer { font-size: 1.4rem; font-weight: bold; font-family: monospace; }
    .timer.active { color: #4CAF50; }

    /* Yenen Taşlar Panelleri */
    .captured-pieces {
      width: 400px; max-width: 90vw; min-height: 28px;
      display: flex; align-items: center; gap: 4px;
      background: #1a1a1a; padding: 4px 10px; border-radius: 4px; margin: 4px 0;
    }
    .captured-pieces img { width: 20px; height: 20px; }
    .score-diff {
      font-size: 0.8rem; font-weight: bold; color: #888; margin-left: 6px;
      background: #2a2a2a; padding: 2px 6px; border-radius: 10px;
    }

    #board { width: 400px; max-width: 90vw; border-radius: 4px; overflow: hidden; }

    /* TEMALAR */
    .theme-classic .white-1e1d3 { background-color: #f0d9b5 !important; }
    .theme-classic .black-3c85d { background-color: #b58863 !important; }

    .theme-wood .white-1e1d3 { background-color: #e3c16f !important; }
    .theme-wood .black-3c85d { background-color: #b8860b !important; }

    .theme-glass #board { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2); }
    .theme-glass .white-1e1d3 { background-color: rgba(255, 255, 255, 0.15) !important; }
    .theme-glass .black-3c85d { background-color: rgba(0, 0, 0, 0.3) !important; }

    .theme-neon .white-1e1d3 { background-color: #1f293d !important; }
    .theme-neon .black-3c85d { background-color: #0f172a !important; }
  </style>
</head>
<body>

  <!-- LOBİ EKRANI -->
  <div id="lobby-screen">
    <h2>Online Satranç</h2>
    
    <div class="input-group">
      <label style="font-size: 0.85rem; color: #aaa;">Oda Kodu (İsteğe Bağlı):</label>
      <input type="text" id="room-input" placeholder="Örn: ODA123" maxlength="10">
    </div>

    <label style="font-size: 0.85rem; color: #aaa; margin-bottom: 8px;">Tema Seçin:</label>
    <div class="theme-grid">
      <button class="theme-btn selected" onclick="setTheme('classic', this)">♟️ Klasik</button>
      <button class="theme-btn" onclick="setTheme('wood', this)">🪵 Ahşap</button>
      <button class="theme-btn" onclick="setTheme('glass', this)">🧊 Saydam</button>
      <button class="theme-btn" onclick="setTheme('neon', this)">⚡ Neon</button>
    </div>

    <button class="action-btn" onclick="joinGame()">Oyna / Odaya Katıl</button>
  </div>

  <!-- OYUN EKRANI -->
  <div id="game-screen">
    <div class="room-bar">
      <span>Oda Kodu: <strong id="display-room-id">-</strong></span>
      <button class="copy-btn" onclick="copyInviteLink()">Davet Linkini Kopyala</button>
    </div>

    <div class="timer-container">
      <div>Siyah: <span id="black-timer" class="timer">10:00</span></div>
      <div>Beyaz: <span id="white-timer" class="timer">10:00</span></div>
    </div>

    <h3 id="status">Oyuncu bekleniyor...</h3>

    <!-- Üst Yenen Taşlar Paneli (Rakibin Yediği / Siyah Yönü) -->
    <div id="top-captured" class="captured-pieces"></div>

    <div id="board"></div>

    <!-- Alt Yenen Taşlar Paneli (Sizin Yediğiniz / Beyaz Yönü) -->
    <div id="bottom-captured" class="captured-pieces"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    const game = new Chess();
    let board = null;
    let myRole = null;
    let selectedTheme = 'classic';
    let currentRoomId = '';

    const moveSound = new Audio('https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/standard/Move.mp3');
    const captureSound = new Audio('https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/standard/Capture.mp3');

    const pieceValues = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
    const startingPieces = { p: 8, n: 2, b: 2, r: 2, q: 1, k: 1 };

    function playSound(isCapture) {
      if (isCapture) {
        captureSound.currentTime = 0;
        captureSound.play().catch(() => {});
      } else {
        moveSound.currentTime = 0;
        moveSound.play().catch(() => {});
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
      document.getElementById('room-input').value = roomParam.toUpperCase();
    }

    function setTheme(theme, btn) {
      selectedTheme = theme;
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }

    function generateRoomId() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function joinGame() {
      const inputVal = document.getElementById('room-input').value.trim();
      currentRoomId = inputVal !== '' ? inputVal.toUpperCase() : generateRoomId();

      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.body.className = 'theme-' + selectedTheme;
      document.getElementById('display-room-id').innerText = currentRoomId;

      socket.emit('joinRoom', currentRoomId);
      initBoard();
    }

    function copyInviteLink() {
      const inviteUrl = window.location.origin + '?room=' + currentRoomId;
      navigator.clipboard.writeText(inviteUrl).then(() => {
        alert('Davet linki kopyalandı! Arkadaşına gönderebilirsin:\n' + inviteUrl);
      });
    }

    function pieceTheme(piece) {
      return 'https://chessboardjs.com/img/chesspieces/wikipedia/' + piece + '.png';
    }

    socket.on('playerRole', (role) => {
      myRole = role;
      updateStatus();
      if (board) board.orientation(myRole === 'b' ? 'black' : 'white');
    });

    socket.on('spectatorRole', () => {
      myRole = 's';
      document.getElementById('status').innerText = 'Oda dolu (İzleyici Modu)';
    });

    socket.on('boardState', (data) => {
      const fenChanged = data.fen !== game.fen();
      game.load(data.fen);
      if (board) board.position(data.fen, true);
      updateStatus();
      updateTimers(data.whiteTime, data.blackTime, game.turn());
      updateCapturedPieces();

      if (fenChanged && data.lastMove) {
        playSound(!!data.lastMove.captured);
      }
    });

    socket.on('timerUpdate', (data) => {
      updateTimers(data.whiteTime, data.blackTime, data.turn);
    });

    socket.on('gameOver', (msg) => {
      alert(msg);
      document.getElementById('status').innerText = msg;
    });

    function updateCapturedPieces() {
      const currentBoard = game.board();
      const currentCounts = {
        w: { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 },
        b: { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 }
      };

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = currentBoard[row][col];
          if (piece) {
            currentCounts[piece.color][piece.type]++;
          }
        }
      }

      const capturedByWhite = []; // Siyahın eksilen taşları
      const capturedByBlack = []; // Beyazın eksilen taşları
      let whiteScore = 0;
      let blackScore = 0;

      ['p', 'n', 'b', 'r', 'q'].forEach(type => {
        const missingBlack = startingPieces[type] - currentCounts.b[type];
        for (let i = 0; i < missingBlack; i++) {
          capturedByWhite.push('b' + type.toUpperCase());
          whiteScore += pieceValues[type];
        }

        const missingWhite = startingPieces[type] - currentCounts.w[type];
        for (let i = 0; i < missingWhite; i++) {
          capturedByBlack.push('w' + type.toUpperCase());
          blackScore += pieceValues[type];
        }
      });

      const topDiv = document.getElementById('top-captured');
      const bottomDiv = document.getElementById('bottom-captured');

      topDiv.innerHTML = '';
      bottomDiv.innerHTML = '';

      // Oyuncu siyahsa tahtayı ters algılar
      const isBlackPlayer = myRole === 'b';
      const topPieces = isBlackPlayer ? capturedByBlack : capturedByWhite;
      const bottomPieces = isBlackPlayer ? capturedByWhite : capturedByBlack;

      topPieces.forEach(p => {
        topDiv.innerHTML += `<img src="${pieceTheme(p)}" alt="${p}">`;
      });
      bottomPieces.forEach(p => {
        bottomDiv.innerHTML += `<img src="${pieceTheme(p)}" alt="${p}">`;
      });

      // Puan farkını yazdır
      const scoreDiff = whiteScore - blackScore;
      if (scoreDiff !== 0) {
        const diffText = scoreDiff > 0 ? `+${scoreDiff}` : `+${Math.abs(scoreDiff)}`;
        if ((scoreDiff > 0 && !isBlackPlayer) || (scoreDiff < 0 && isBlackPlayer)) {
          bottomDiv.innerHTML += `<span class="score-diff">${diffText}</span>`;
        } else {
          topDiv.innerHTML += `<span class="score-diff">${diffText}</span>`;
        }
      }
    }

    function updateTimers(wTime, bTime, turn) {
      document.getElementById('white-timer').innerText = formatTime(wTime);
      document.getElementById('black-timer').innerText = formatTime(bTime);
      document.getElementById('white-timer').classList.toggle('active', turn === 'w');
      document.getElementById('black-timer').classList.toggle('active', turn === 'b');
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function onDragStart(source, piece) {
      if (game.game_over() || myRole === 's') return false;
      if ((game.turn() === 'w' && myRole !== 'w') || (game.turn() === 'b' && myRole !== 'b')) return false;
      if ((game.turn() === 'w' && piece.search(/^b/) !== -1) || (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
    }

    function onDrop(source, target) {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';
      socket.emit('move', { from: source, to: target, promotion: 'q' });
    }

    function updateStatus() {
      let statusText = '';
      const turnName = game.turn() === 'w' ? 'Beyaz' : 'Siyah';

      if (game.in_checkmate()) {
        statusText = `Şah Mat! Kazanan: ${turnName === 'Beyaz' ? 'Siyah' : 'Beyaz'}`;
      } else if (game.in_draw()) {
        statusText = 'Oyun Berabere!';
      } else {
        statusText = `Sıra: ${turnName}`;
        if (myRole === 'w') statusText += ' (Sen: Beyaz)';
        if (myRole === 'b') statusText += ' (Sen: Siyah)';
      }
      document.getElementById('status').innerText = statusText;
    }

    function initBoard() {
      if (board) return;
      board = Chessboard('board', {
        draggable: true,
        position: 'start',
        orientation: myRole === 'b' ? 'black' : 'white',
        pieceTheme: pieceTheme,
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: () => board.position(game.fen())
      });
    }
  </script>
</body>
</html>
