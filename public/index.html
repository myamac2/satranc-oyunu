<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLED Satranç Studio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  
  <style>
    :root {
      --bg-main: #050505;
      --bg-card: #0e0e11;
      --bg-card-hover: #16161c;
      --border-color: #1e1e24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #71717a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 20px;
    }

    #toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: rgba(14, 14, 17, 0.92);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateX(40px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
      max-width: 340px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }

    .toast.info { border-left: 4px solid var(--accent-blue); }
    .toast.success { border-left: 4px solid var(--accent-green); }
    .toast.warning { border-left: 4px solid var(--accent-orange); }
    .toast.error { border-left: 4px solid var(--accent-red); }

    #lobby-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 36px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      width: 380px;
      max-width: 95vw;
    }

    #lobby-screen h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-bottom: 24px;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input[type="text"] {
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: #141418;
      color: white;
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    #game-screen {
      display: none;
      flex-direction: row;
      align-items: flex-start;
      gap: 20px;
      width: 100%;
      max-width: 800px;
    }

    .board-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      flex: 1;
      width: 100%;
      max-width: 440px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 12px;
    }

    .room-badge {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .room-badge strong {
      color: var(--text-main);
    }

    .copy-btn {
      background: #1e1e24;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      transition: background 0.2s;
    }

    .copy-btn:hover {
      background: #2a2a32;
    }

    .timer-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }

    .timer-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 12px;
    }

    .timer-card.active {
      border-color: var(--accent-green);
    }

    .player-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .timer {
      font-size: 1.3rem;
      font-weight: 700;
      font-family: monospace;
    }

    .status-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      min-height: 24px;
    }

    .captured-pieces {
      width: 100%;
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 8px;
    }

    .captured-pieces img {
      width: 22px;
      height: 22px;
    }

    .score-diff {
      font-size: 0.75rem;
      font-weight: 700;
      background: #22222a;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: auto;
    }

    #board {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      user-select: none;
    }

    .square-55d63 {
      cursor: pointer;
    }

    /* KONTRAST DÜZENLEMESİ (BEYAZ VE SIYAH KARELER) */
    .white-1e1d3 {
      background-color: #3d414a !important;
      color: #71717a !important;
    }

    .black-3c85d {
      background-color: #212328 !important;
      color: #4b4d54 !important;
    }

    .highlight-move {
      box-shadow: inset 0 0 0 1000px rgba(255, 215, 0, 0.28) !important;
    }

    .selected-square {
      background-color: rgba(59, 130, 246, 0.4) !important;
    }

    .check-square {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.9) 0%, rgba(220, 38, 38, 0.6) 50%, rgba(185, 28, 28, 0) 85%) !important;
    }

    .legal-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 26%;
      height: 26%;
      background-color: rgba(34, 197, 94, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }

    .legal-capture::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      border: 5px solid rgba(34, 197, 94, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }

    .move-history-panel {
      width: 260px;
      height: 580px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }

    .move-row {
      display: flex;
      padding: 6px 8px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .move-num {
      width: 36px;
      color: var(--text-muted);
    }

    .move-white, .move-black {
      flex: 1;
    }

    .control-buttons {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg-card);
      color: var(--text-main);
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--bg-card-hover);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 16px;
      width: 320px;
      text-align: center;
    }

    .modal-box h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
    }

    .modal-box p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-accept {
      background: var(--accent-green);
      color: white;
      border: none;
    }

    .btn-decline {
      background: var(--accent-red);
      color: white;
      border: none;
    }

    @media (max-width: 768px) {
      #game-screen {
        flex-direction: column;
        align-items: center;
      }
      .move-history-panel {
        width: 100%;
        max-width: 440px;
        height: 200px;
      }
      #toast-container {
        top: 12px;
        right: 12px;
        left: 12px;
      }
      .toast {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div id="lobby-screen">
    <h2>STUDIO CHESS</h2>
    <div class="input-group">
      <label>Oda Kodu</label>
      <input type="text" id="room-input" placeholder="Rastgele Veya Kod Girin" maxlength="10">
    </div>
    <button class="action-btn" onclick="joinGame()">Odaya Katıl</button>
  </div>

  <div id="game-screen">
    <div class="board-container">
      <div class="top-bar">
        <div class="room-badge">Oda Kodu: <strong id="display-room-id">-</strong></div>
        <button class="copy-btn" onclick="copyInviteLink()">Davet Linki</button>
      </div>

      <div class="timer-container">
        <div id="black-timer-card" class="timer-card">
          <span class="player-label">Siyah</span>
          <span id="black-timer" class="timer">10:00</span>
        </div>
        <div id="white-timer-card" class="timer-card">
          <span class="player-label">Beyaz</span>
          <span id="white-timer" class="timer">10:00</span>
        </div>
      </div>

      <div id="status" class="status-text">Oyuncu bekleniyor...</div>
      <div id="top-captured" class="captured-pieces"></div>
      <div id="board"></div>
      <div id="bottom-captured" class="captured-pieces"></div>

      <div class="control-buttons">
        <button class="btn" onclick="resignGame()">Pes Et</button>
        <button class="btn" onclick="restartGame()">Yeniden Başlat</button>
      </div>
    </div>

    <div class="move-history-panel">
      <div class="panel-header">
        <span>Hamle Geçmişi</span>
        <span id="move-count" style="font-size:0.75rem; color:var(--text-muted);">0 Hamle</span>
      </div>
      <div id="history-list" class="history-list"></div>
    </div>
  </div>

  <div id="restart-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>Yeniden Başlatma İsteği</h3>
      <p>Rakibiniz oyunu yeniden başlatmak istiyor. Kabul ediyor musunuz?</p>
      <div class="modal-buttons">
        <button class="btn btn-accept" onclick="respondRestart(true)">Kabul Et</button>
        <button class="btn btn-decline" onclick="respondRestart(false)">Reddet</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    const game = new Chess();
    let board = null;
    let myRole = null;
    let currentRoomId = '';
    let selectedSquare = null;

    const moveSound = new Audio('https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/standard/Move.mp3');
    const captureSound = new Audio('https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/standard/Capture.mp3');

    const pieceValues = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
    const startingPieces = { p: 8, n: 2, b: 2, r: 2, q: 1, k: 1 };

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerText = message;
      container.appendChild(toast);

      setTimeout(() => toast.classList.add('show'), 10);

      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // YÜKSEK KONTRASTLI 'MAESTRO' TAŞ TEMA SETİ
    function pieceTheme(piece) {
      return 'https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/maestro/' + piece + '.svg';
    }

    function playSound(isCapture) {
      if (isCapture) {
        captureSound.currentTime = 0;
        captureSound.play().catch(() => {});
      } else {
        moveSound.currentTime = 0;
        moveSound.play().catch(() => {});
      }
    }

    function removeHighlights() {
      $('#board .square-55d63').removeClass('highlight-move check-square selected-square');
    }

    function highlightSquare(square) {
      $('#board .square-' + square).addClass('highlight-move');
    }

    function removeGreySquares() {
      $('#board .square-55d63').removeClass('legal-dot legal-capture');
    }

    function greySquare(square, isCapture) {
      const $square = $('#board .square-' + square);
      if (isCapture) {
        $square.addClass('legal-capture');
      } else {
        $square.addClass('legal-dot');
      }
    }

    function highlightCheck() {
      if (game.in_check() || game.in_checkmate()) {
        const turn = game.turn();
        const currentBoard = game.board();

        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const piece = currentBoard[row][col];
            if (piece && piece.type === 'k' && piece.color === turn) {
              const file = String.fromCharCode(97 + col);
              const rank = 8 - row;
              const kingSquare = file + rank;
              $('#board .square-' + kingSquare).addClass('check-square');
              return;
            }
          }
        }
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
      document.getElementById('room-input').value = roomParam.toUpperCase();
      joinGame();
    }

    function generateRoomId() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function joinGame() {
      const inputVal = document.getElementById('room-input').value.trim();
      currentRoomId = inputVal !== '' ? inputVal.toUpperCase() : generateRoomId();

      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById('display-room-id').innerText = currentRoomId;

      socket.emit('joinRoom', currentRoomId);
      initBoard();
    }

    function copyInviteLink() {
      const inviteUrl = window.location.origin + '?room=' + currentRoomId;
      navigator.clipboard.writeText(inviteUrl).then(() => {
        showToast('Davet linki panoya kopyalandı!', 'success');
      });
    }

    function resignGame() {
      if (myRole === 's') return;
      if (confirm('Pes etmek istediğinize emin misiniz?')) {
        socket.emit('resign');
      }
    }

    function restartGame() {
      if (myRole === 's') return;
      showToast('Yeniden başlatma isteği rakibe iletildi.', 'info');
      socket.emit('requestRestart');
    }

    function respondRestart(accepted) {
      document.getElementById('restart-modal').style.display = 'none';
      if (accepted) {
        socket.emit('acceptRestart');
      } else {
        socket.emit('declineRestart');
      }
    }

    socket.on('restartRequested', () => {
      document.getElementById('restart-modal').style.display = 'flex';
    });

    socket.on('restartDeclined', () => {
      showToast('Rakibiniz yeniden başlatma isteğini reddetti.', 'warning');
    });

    socket.on('playerRole', (role) => {
      myRole = role;
      updateStatus();
      if (board) board.orientation(myRole === 'b' ? 'black' : 'white');
    });

    socket.on('spectatorRole', () => {
      myRole = 's';
      document.getElementById('status').innerText = 'Oda dolu (İzleyici Modu)';
    });

    socket.on('gameStatus', (msg) => {
      document.getElementById('status').innerText = msg;
      if (msg === 'Oyun Başladı!') {
        showToast('Rakip bağlandı, oyun başladı!', 'success');
      } else if (msg === 'Oyun yeniden başlatıldı!') {
        showToast('Tahta sıfırlandı, yeni oyun başladı!', 'success');
      }
    });

    socket.on('boardState', (data) => {
      const fenChanged = data.fen !== game.fen();
      game.load(data.fen);
      if (board) board.position(data.fen, true);

      selectedSquare = null;
      updateStatus();
      updateTimers(data.whiteTime, data.blackTime, game.turn());
      updateCapturedPieces();
      updateMoveHistory();

      removeHighlights();
      removeGreySquares();
      if (data.lastMove) {
        highlightSquare(data.lastMove.from);
        highlightSquare(data.lastMove.to);
      }

      highlightCheck();

      if (fenChanged && data.lastMove) {
        playSound(!!data.lastMove.captured);
      }
    });

    socket.on('timerUpdate', (data) => {
      updateTimers(data.whiteTime, data.blackTime, data.turn);
    });

    socket.on('gameOver', (msg) => {
      showToast(msg, 'error');
      document.getElementById('status').innerText = msg;
    });

    function updateMoveHistory() {
      const history = game.history();
      const listContainer = document.getElementById('history-list');
      document.getElementById('move-count').innerText = `${history.length} Hamle`;

      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        const moveNum = Math.floor(i / 2) + 1;
        const whiteMove = history[i] || '';
        const blackMove = history[i + 1] || '';

        html += `
          <div class="move-row">
            <span class="move-num">${moveNum}.</span>
            <span class="move-white">${whiteMove}</span>
            <span class="move-black">${blackMove}</span>
          </div>
        `;
      }

      listContainer.innerHTML = html;
      listContainer.scrollTop = listContainer.scrollHeight;
    }

    function updateCapturedPieces() {
      const currentBoard = game.board();
      const currentCounts = {
        w: { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 },
        b: { p: 0, n: 0, b: 0, r: 0, q: 0, k: 0 }
      };

      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const piece = currentBoard[row][col];
          if (piece) {
            currentCounts[piece.color][piece.type]++;
          }
        }
      }

      const capturedByWhite = [];
      const capturedByBlack = [];
      let whiteScore = 0;
      let blackScore = 0;

      ['p', 'n', 'b', 'r', 'q'].forEach(type => {
        const missingBlack = startingPieces[type] - currentCounts.b[type];
        for (let i = 0; i < missingBlack; i++) {
          capturedByWhite.push('b' + type.toUpperCase());
          whiteScore += pieceValues[type];
        }

        const missingWhite = startingPieces[type] - currentCounts.w[type];
        for (let i = 0; i < missingWhite; i++) {
          capturedByBlack.push('w' + type.toUpperCase());
          blackScore += pieceValues[type];
        }
      });

      const topDiv = document.getElementById('top-captured');
      const bottomDiv = document.getElementById('bottom-captured');

      topDiv.innerHTML = '';
      bottomDiv.innerHTML = '';

      const isBlackPlayer = myRole === 'b';
      const topPieces = isBlackPlayer ? capturedByBlack : capturedByWhite;
      const bottomPieces = isBlackPlayer ? capturedByWhite : capturedByBlack;

      topPieces.forEach(p => {
        topDiv.innerHTML += `<img src="${pieceTheme(p)}" alt="${p}">`;
      });
      bottomPieces.forEach(p => {
        bottomDiv.innerHTML += `<img src="${pieceTheme(p)}" alt="${p}">`;
      });

      const scoreDiff = whiteScore - blackScore;
      if (scoreDiff !== 0) {
        const diffText = scoreDiff > 0 ? `+${scoreDiff}` : `+${Math.abs(scoreDiff)}`;
        if ((scoreDiff > 0 && !isBlackPlayer) || (scoreDiff < 0 && isBlackPlayer)) {
          bottomDiv.innerHTML += `<span class="score-diff">${diffText}</span>`;
        } else {
          topDiv.innerHTML += `<span class="score-diff">${diffText}</span>`;
        }
      }
    }

    function updateTimers(wTime, bTime, turn) {
      document.getElementById('white-timer').innerText = formatTime(wTime);
      document.getElementById('black-timer').innerText = formatTime(bTime);
      
      document.getElementById('white-timer-card').classList.toggle('active', turn === 'w');
      document.getElementById('black-timer-card').classList.toggle('active', turn === 'b');
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function showLegalMoves(square) {
      removeGreySquares();
      const moves = game.moves({ square: square, verbose: true });
      if (moves.length === 0) return;

      for (let i = 0; i < moves.length; i++) {
        const isCapture = !!moves[i].captured;
        greySquare(moves[i].to, isCapture);
      }
    }

    function handleSquareClick(square) {
      if (game.game_over() || myRole === 's') return;
      if ((game.turn() === 'w' && myRole !== 'w') || (game.turn() === 'b' && myRole !== 'b')) return;

      const pieceOnSquare = game.get(square);

      if (!selectedSquare) {
        if (pieceOnSquare && pieceOnSquare.color === game.turn()) {
          selectedSquare = square;
          $('#board .square-' + square).addClass('selected-square');
          showLegalMoves(square);
        }
        return;
      }

      if (selectedSquare === square) {
        selectedSquare = null;
        $('#board .square-55d63').removeClass('selected-square');
        removeGreySquares();
        return;
      }

      if (pieceOnSquare && pieceOnSquare.color === game.turn()) {
        $('#board .square-55d63').removeClass('selected-square');
        selectedSquare = square;
        $('#board .square-' + square).addClass('selected-square');
        showLegalMoves(square);
        return;
      }

      const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });

      if (move === null) {
        selectedSquare = null;
        $('#board .square-55d63').removeClass('selected-square');
        removeGreySquares();
      } else {
        const fromSquare = selectedSquare;
        selectedSquare = null;
        
        removeGreySquares();
        removeHighlights();
        highlightSquare(fromSquare);
        highlightSquare(square);
        highlightCheck();

        board.position(game.fen());
        socket.emit('move', { from: fromSquare, to: square, promotion: 'q' });
      }
    }

    function updateStatus() {
      let statusText = '';
      const turnName = game.turn() === 'w' ? 'Beyaz' : 'Siyah';

      if (game.in_checkmate()) {
        statusText = `Şah Mat! Kazanan: ${turnName === 'Beyaz' ? 'Siyah' : 'Beyaz'}`;
      } else if (game.in_draw()) {
        statusText = 'Oyun Berabere!';
      } else {
        statusText = `Hamle Sırası: ${turnName}`;
        if (game.in_check()) statusText += ' (ŞAH!)';
        if (myRole === 'w') statusText += ' • Sen: Beyaz';
        if (myRole === 'b') statusText += ' • Sen: Siyah';
      }
      document.getElementById('status').innerText = statusText;
    }

    function initBoard() {
      if (board) return;

      board = Chessboard('board', {
        draggable: false,
        position: 'start',
        orientation: myRole === 'b' ? 'black' : 'white',
        pieceTheme: pieceTheme
      });

      $('#board').on('click', '.square-55d63', function () {
        const square = $(this).attr('data-square');
        handleSquareClick(square);
      });
    }
  </script>
</body>
</html>
