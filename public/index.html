<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OLED Satranç Studio Pro</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  
  <style>
    :root {
      --bg-main: #050505;
      --bg-card: #0e0e11;
      --bg-card-hover: #16161c;
      --border-color: #1e1e24;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #71717a;

      /* Varsayılan Tahta Renkleri (OLED Karanlık) */
      --sq-light: #3d414a;
      --sq-dark: #212328;
      --sq-light-text: #71717a;
      --sq-dark-text: #4b4d54;
    }

    /* Tema Seçenekleri CSS Değişkenleri */
    body.theme-wood {
      --sq-light: #eadeca;
      --sq-dark: #b8860b;
      --sq-light-text: #8b5a2b;
      --sq-dark-text: #5c3a21;
    }

    body.theme-neon {
      --sq-light: #1e293b;
      --sq-dark: #0f172a;
      --sq-light-text: #38bdf8;
      --sq-dark-text: #1e3a8a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; background-color: var(--bg-main); color: var(--text-main); padding: 15px;
    }

    #toast-container {
      position: fixed; top: 24px; right: 24px; z-index: 9999;
      display: flex; flex-direction: column; gap: 10px; pointer-events: none;
    }

    .toast {
      background: rgba(14, 14, 17, 0.92); border: 1px solid var(--border-color);
      color: var(--text-main); padding: 14px 20px; border-radius: 12px;
      font-size: 0.88rem; font-weight: 600; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(12px); opacity: 0; transform: translateX(40px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; max-width: 340px;
    }
    .toast.show { opacity: 1; transform: translateX(0); }
    .toast.info { border-left: 4px solid var(--accent-blue); }
    .toast.success { border-left: 4px solid var(--accent-green); }
    .toast.warning { border-left: 4px solid var(--accent-orange); }
    .toast.error { border-left: 4px solid var(--accent-red); }

    #lobby-screen {
      display: flex; flex-direction: column; align-items: center; background: var(--bg-card);
      border: 1px solid var(--border-color); padding: 32px; border-radius: 20px;
      width: 400px; max-width: 95vw; gap: 16px;
    }

    .input-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .input-group label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    input, select {
      padding: 12px; border-radius: 10px; border: 1px solid var(--border-color);
      background: #141418; color: white; font-size: 0.95rem; font-weight: 600; outline: none; width: 100%;
    }

    .action-btn {
      width: 100%; padding: 14px; background: #ffffff; color: #000;
      border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .action-btn:hover { background: #e2e8f0; }

    .ai-btn { background: #1e1e24; color: #fff; border: 1px solid var(--border-color); }
    .ai-btn:hover { background: #2a2a32; }

    #game-screen {
      display: none; flex-direction: row; gap: 24px; width: 100%; max-width: 1000px; justify-content: center; align-items: flex-start;
    }

    .board-container {
      display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; max-width: 580px; width: 100%;
    }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      background: var(--bg-card); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 12px;
    }

    .theme-selector-group {
      display: flex; gap: 8px; align-items: center;
    }
    .theme-selector-group select {
      padding: 4px 8px; font-size: 0.78rem; border-radius: 8px; background: #18181f;
    }

    .player-card {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      background: var(--bg-card); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 12px; min-height: 48px;
    }
    .player-card.active { border-color: var(--accent-green); }

    .captured-pieces { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
    .captured-pieces img { width: 22px; height: 22px; }

    .timer { font-size: 1.2rem; font-weight: 700; font-family: monospace; }

    #board { width: 100%; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }

    /* Dinamik Kare Renkleri */
    .white-1e1d3 { background-color: var(--sq-light) !important; color: var(--sq-light-text) !important; }
    .black-3c85d { background-color: var(--sq-dark) !important; color: var(--sq-dark-text) !important; }

    .highlight-move { box-shadow: inset 0 0 0 1000px rgba(234, 179, 8, 0.35) !important; }
    .selected-square { background-color: rgba(59, 130, 246, 0.5) !important; }
    .check-square { background: radial-gradient(circle, rgba(239, 68, 68, 0.95) 0%, rgba(220, 38, 38, 0.7) 60%, rgba(185, 28, 28, 0) 90%) !important; }

    .legal-dot::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 26%; height: 26%; background-color: rgba(34, 197, 94, 0.75); border-radius: 50%; pointer-events: none;
    }
    .legal-capture::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border: 5px solid rgba(34, 197, 94, 0.75); border-radius: 50%; pointer-events: none;
    }

    .right-panel {
      width: 320px; display: flex; flex-direction: column; gap: 12px; height: 700px;
    }

    .panel-box {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
      display: flex; flex-direction: column; overflow: hidden;
    }

    .history-box { flex: 1; }
    .chat-box { flex: 1.2; }

    .panel-header {
      padding: 10px 14px; border-bottom: 1px solid var(--border-color);
      font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;
      display: flex; justify-content: space-between;
    }

    .history-list, .chat-messages { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 0.85rem; }

    .chat-input-area { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border-color); }
    .chat-input-area input { font-size: 0.85rem; padding: 8px; }

    .emoji-row { display: flex; gap: 6px; padding: 4px 8px; background: #121216; overflow-x: auto; }
    .emoji-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; }

    .control-buttons { display: flex; gap: 6px; width: 100%; flex-wrap: wrap; margin-top: 4px; }
    .btn {
      flex: 1; min-width: 70px; padding: 10px 6px; border: 1px solid var(--border-color); border-radius: 10px;
      font-weight: 600; cursor: pointer; background: var(--bg-card); color: var(--text-main); font-size: 0.78rem; text-align: center;
    }
    .btn:hover { background: var(--bg-card-hover); }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 1000;
      align-items: center; justify-content: center;
    }
    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border-color); padding: 24px;
      border-radius: 16px; width: 320px; text-align: center;
    }

    .promotion-pieces { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
    .promotion-pieces img { width: 48px; height: 48px; cursor: pointer; background: #1a1a22; border-radius: 8px; padding: 4px; }
    .promotion-pieces img:hover { background: var(--accent-blue); }

    @media (max-width: 900px) {
      #game-screen { flex-direction: column; align-items: center; }
      .right-panel { width: 100%; max-width: 580px; height: 400px; }
    }
  </style>
</head>
<body class="theme-oled">

  <div id="toast-container"></div>

  <div id="lobby-screen">
    <h2 style="font-size:1.4rem;">STUDIO CHESS PRO</h2>
    <div class="input-group">
      <label>Oda Kodu</label>
      <input type="text" id="room-input" placeholder="Rastgele veya Kod Girin" maxlength="10">
    </div>
    <div class="input-group">
      <label>Zaman Kontrolü</label>
      <select id="time-select">
        <option value="0|0">♾️ Süresiz (Zamansız)</option>
        <option value="1|0">Bullet (1 Dakika)</option>
        <option value="3|2">Blitz (3 Dk + 2 Sn)</option>
        <option value="5|3">Blitz (5 Dk + 3 Sn)</option>
        <option value="10|0" selected>Rapid (10 Dakika)</option>
      </select>
    </div>
    <button class="action-btn" onclick="joinGame(false)">Rakip Ara / Odaya Katıl</button>
    <button class="action-btn ai-btn" onclick="joinGame(true)">🤖 Bot'a Karşı Oyna</button>
  </div>

  <div id="game-screen">
    <div class="board-container">
      <div class="top-bar">
        <span style="font-size:0.8rem; color:var(--text-muted)">Oda: <strong id="display-room-id" style="color:#fff">-</strong></span>
        
        <!-- Tema Seçim Alanı -->
        <div class="theme-selector-group">
          <select id="board-theme-select" onchange="changeBoardTheme(this.value)">
            <option value="theme-oled">🖤 OLED Karanlık</option>
            <option value="theme-wood">🪵 Ahşap Sıcaklığı</option>
            <option value="theme-neon">⚡ Cyber Neon</option>
          </select>
          <select id="piece-theme-select" onchange="changePieceTheme(this.value)">
            <option value="maestro">🎨 Maestro Seti</option>
            <option value="neo">✨ Neo Modern</option>
            <option value="staunty">♟️ Klasik Staunton</option>
          </select>
        </div>

        <div>
          <button class="btn" style="padding:4px 8px;" onclick="copyPGN()">PGN</button>
          <button class="btn" style="padding:4px 8px;" onclick="copyFEN()">FEN</button>
        </div>
      </div>

      <!-- Rakip Paneli (Üst) -->
      <div id="top-player-card" class="player-card">
        <div style="display:flex; align-items:center; gap:8px;">
          <span id="top-player-name" style="font-size:0.85rem; font-weight:700;">Rakip</span>
          <div id="top-captured" class="captured-pieces"></div>
        </div>
        <span id="top-timer" class="timer">--:--</span>
      </div>

      <div id="board"></div>

      <!-- Oyuncu Paneli (Alt) -->
      <div id="bottom-player-card" class="player-card">
        <div style="display:flex; align-items:center; gap:8px;">
          <span id="bottom-player-name" style="font-size:0.85rem; font-weight:700;">Siz</span>
          <div id="bottom-captured" class="captured-pieces"></div>
        </div>
        <span id="bottom-timer" class="timer">--:--</span>
      </div>

      <div class="control-buttons">
        <button id="takeback-btn" class="btn" onclick="takebackMove()" style="display:none;">Geri Al (3)</button>
        <button class="btn" onclick="offerDraw()">Beraberlik</button>
        <button class="btn" onclick="resignGame()">Pes Et</button>
        <button class="btn" onclick="restartGame()">Sıfırla</button>
        <button class="btn" style="background:#1e1e24;" onclick="goToMainMenu()">🏠 Ana Menü</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="panel-box history-box">
        <div class="panel-header"><span>Hamleler</span><span id="move-count">0</span></div>
        <div id="history-list" class="history-list"></div>
      </div>

      <div class="panel-box chat-box">
        <div class="panel-header">Sohbet</div>
        <div id="chat-messages" class="chat-messages"></div>
        <div class="emoji-row">
          <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
          <button class="emoji-btn" onclick="sendEmoji('🤝')">🤝</button>
          <button class="emoji-btn" onclick="sendEmoji('🧠')">🧠</button>
          <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
        </div>
        <div class="chat-input-area">
          <input type="text" id="chat-input" placeholder="Mesaj yazın..." onkeypress="if(event.key==='Enter') sendMessage()">
          <button class="btn" style="width:auto;" onclick="sendMessage()">Gönder</button>
        </div>
      </div>
    </div>
  </div>

  <div id="promotion-modal" class="modal-overlay">
    <div class="modal-box">
      <h3>Piyon Terfisi</h3>
      <p>Dönüştürmek istediğiniz taşı seçin:</p>
      <div class="promotion-pieces">
        <img id="prom-q" onclick="selectPromotion('q')" alt="Vezir">
        <img id="prom-r" onclick="selectPromotion('r')" alt="Kale">
        <img id="prom-b" onclick="selectPromotion('b')" alt="Fil">
        <img id="prom-n" onclick="selectPromotion('n')" alt="At">
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    let game = new Chess();
    let board = null;
    let myRole = 'w';
    let currentRoomId = '';
    let selectedSquare = null;
    let pendingMove = null;
    let currentPGN = '';
    let previousFen = '';
    let currentPieceSet = 'maestro';

    const moveSound = new Audio('https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/standard/Move.mp3');
    const captureSound = new Audio('https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/standard/Capture.mp3');
    const checkSound = new Audio('https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/sound/standard/Check.mp3');

    function pieceTheme(piece) {
      return `https://cdn.jsdelivr.net/gh/lichess-org/lila@master/public/piece/${currentPieceSet}/${piece}.svg`;
    }

    function changeBoardTheme(themeName) {
      document.body.className = themeName;
    }

    function changePieceTheme(pieceSetName) {
      currentPieceSet = pieceSetName;
      if (board) {
        board.destroy();
        board = null;
        initBoard();
        board.position(game.fen());
        updateCapturedPieces();
      }
    }

    function playMoveAudio(moveObj) {
      if (!moveObj) return;
      const inCheck = typeof game.in_check === 'function' ? game.in_check() : game.inCheck();
      if (inCheck) {
        checkSound.play().catch(()=>{});
      } else if (moveObj.captured) {
        captureSound.play().catch(()=>{});
      } else {
        moveSound.play().catch(()=>{});
      }
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3500);
    }

    function joinGame(isVsAi) {
      const inputVal = document.getElementById('room-input').value.trim();
      const timeVal = document.getElementById('time-select').value.split('|');
      currentRoomId = inputVal !== '' ? inputVal.toUpperCase() : Math.random().toString(36).substring(2, 8).toUpperCase();

      document.getElementById('lobby-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'flex';
      document.getElementById('display-room-id').innerText = currentRoomId;

      socket.emit('joinRoom', {
        roomId: currentRoomId,
        timeConfig: { time: parseInt(timeVal[0]), inc: parseInt(timeVal[1]) },
        isVsAi: isVsAi
      });
      initBoard();
    }

    function goToMainMenu() {
      if (confirm('Ana menüye dönmek istediğinizden emin misiniz?')) {
        socket.emit('leaveRoom');
        game.reset();
        previousFen = '';
        if (board) {
          board.destroy();
          board = null;
        }
        document.getElementById('chat-messages').innerHTML = '';
        document.getElementById('history-list').innerHTML = '';
        document.getElementById('move-count').innerText = '0';
        
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('lobby-screen').style.display = 'flex';
        showToast('Ana menüye dönüldü.', 'info');
      }
    }

    function handleSquareClick(square) {
      const isGameOver = typeof game.isGameOver === 'function' ? game.isGameOver() : game.game_over();
      if (isGameOver || myRole === 's') return;
      if ((game.turn() === 'w' && myRole !== 'w') || (game.turn() === 'b' && myRole !== 'b')) return;

      const piece = game.get(square);

      if (!selectedSquare) {
        if (piece && piece.color === game.turn()) {
          selectedSquare = square;
          $('#board .square-' + square).addClass('selected-square');
          showLegalMoves(square);
        }
        return;
      }

      if (selectedSquare === square) {
        resetSelection();
        return;
      }

      const sourcePiece = game.get(selectedSquare);
      const isPawn = sourcePiece && sourcePiece.type === 'p';
      const isPromotionRank = (game.turn() === 'w' && square[1] === '8') || (game.turn() === 'b' && square[1] === '1');

      if (isPawn && isPromotionRank) {
        const moves = game.moves({ square: selectedSquare, verbose: true });
        const canPromote = moves.some(m => m.to === square);
        if (canPromote) {
          pendingMove = { from: selectedSquare, to: square };
          openPromotionModal();
          return;
        }
      }

      executeMove(selectedSquare, square, 'q');
    }

    function executeMove(from, to, promotion) {
      const move = game.move({ from, to, promotion });
      if (move) {
        playMoveAudio(move);
        socket.emit('move', { from, to, promotion });
        board.position(game.fen());
      }
      resetSelection();
    }

    function takebackMove() { socket.emit('takeback'); }

    function openPromotionModal() {
      const color = game.turn();
      document.getElementById('prom-q').src = pieceTheme(color + 'Q');
      document.getElementById('prom-r').src = pieceTheme(color + 'R');
      document.getElementById('prom-b').src = pieceTheme(color + 'B');
      document.getElementById('prom-n').src = pieceTheme(color + 'N');
      document.getElementById('promotion-modal').style.display = 'flex';
    }

    function selectPromotion(pieceType) {
      document.getElementById('promotion-modal').style.display = 'none';
      if (pendingMove) {
        executeMove(pendingMove.from, pendingMove.to, pieceType);
        pendingMove = null;
      }
    }

    function resetSelection() {
      selectedSquare = null;
      $('#board .square-55d63').removeClass('selected-square legal-dot legal-capture');
    }

    function showLegalMoves(square) {
      $('#board .square-55d63').removeClass('legal-dot legal-capture');
      const moves = game.moves({ square: square, verbose: true });
      moves.forEach(m => {
        const $sq = $('#board .square-' + m.to);
        if (m.captured) $sq.addClass('legal-capture');
        else $sq.addClass('legal-dot');
      });
    }

    function highlightLastMoveAndCheck(lastMove) {
      $('#board .square-55d63').removeClass('highlight-move check-square');

      if (lastMove) {
        $('#board .square-' + lastMove.from).addClass('highlight-move');
        $('#board .square-' + lastMove.to).addClass('highlight-move');
      }

      const inCheck = typeof game.in_check === 'function' ? game.in_check() : game.inCheck();
      if (inCheck) {
        const turn = game.turn();
        const boardState = game.board();
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const p = boardState[r][c];
            if (p && p.type === 'k' && p.color === turn) {
              const file = String.fromCharCode(97 + c);
              const rank = 8 - r;
              $('#board .square-' + file + rank).addClass('check-square');
            }
          }
        }
      }
    }

    function updateCapturedPieces() {
      const initialCounts = { p: 8, r: 2, n: 2, b: 2, q: 1 };
      const currentCounts = { w: { p: 0, r: 0, n: 0, b: 0, q: 0 }, b: { p: 0, r: 0, n: 0, b: 0, q: 0 } };

      const boardState = game.board();
      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          const p = boardState[r][c];
          if (p && p.type !== 'k') {
            currentCounts[p.color][p.type]++;
          }
        }
      }

      const capturedW = [];
      const capturedB = [];

      ['p', 'n', 'b', 'r', 'q'].forEach(type => {
        const missingW = initialCounts[type] - currentCounts['w'][type];
        for (let i = 0; i < missingW; i++) capturedW.push('w' + type.toUpperCase());

        const missingB = initialCounts[type] - currentCounts['b'][type];
        for (let i = 0; i < missingB; i++) capturedB.push('b' + type.toUpperCase());
      });

      const topCapturedContainer = document.getElementById('top-captured');
      const bottomCapturedContainer = document.getElementById('bottom-captured');

      if (myRole === 'b') {
        topCapturedContainer.innerHTML = capturedB.map(p => `<img src="${pieceTheme(p)}">`).join('');
        bottomCapturedContainer.innerHTML = capturedW.map(p => `<img src="${pieceTheme(p)}">`).join('');
      } else {
        topCapturedContainer.innerHTML = capturedW.map(p => `<img src="${pieceTheme(p)}">`).join('');
        bottomCapturedContainer.innerHTML = capturedB.map(p => `<img src="${pieceTheme(p)}">`).join('');
      }
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      if (input.value.trim()) {
        socket.emit('sendMessage', input.value.trim());
        input.value = '';
      }
    }

    function sendEmoji(emoji) { socket.emit('sendMessage', emoji); }

    socket.on('chatMessage', (data) => {
      const list = document.getElementById('chat-messages');
      list.innerHTML += `<div><strong>${data.sender}:</strong> ${data.text}</div>`;
      list.scrollTop = list.scrollHeight;
    });

    socket.on('toast', (data) => { showToast(data.msg, data.type); });

    socket.on('boardState', (data) => {
      const isNewBoard = data.fen !== previousFen;
      game.load(data.fen);
      currentPGN = data.pgn;
      
      if (board) {
        board.position(data.fen, true);
      }

      updateTimers(data.whiteTime, data.blackTime, game.turn(), data.isUnlimited);
      updateHistory();
      highlightLastMoveAndCheck(data.lastMove);
      updateCapturedPieces();

      if (data.isVsAi) {
        const $btn = $('#takeback-btn');
        $btn.show().text(`Geri Al (${data.takebacksRemaining})`);
        if (data.takebacksRemaining <= 0) {
          $btn.prop('disabled', true).css('opacity', '0.5');
        } else {
          $btn.prop('disabled', false).css('opacity', '1');
        }
      } else {
        $('#takeback-btn').hide();
      }

      if (isNewBoard && data.lastMove) {
        playMoveAudio(data.lastMove);
      }
      previousFen = data.fen;
    });

    socket.on('playerRole', (role) => {
      myRole = role;
      document.getElementById('bottom-player-name').innerText = role === 'b' ? 'Siyah (Siz)' : 'Beyaz (Siz)';
      document.getElementById('top-player-name').innerText = role === 'b' ? 'Beyaz (Rakip)' : 'Siyah (Rakip)';
      if (board) board.orientation(role === 'b' ? 'black' : 'white');
    });

    socket.on('timerUpdate', (data) => {
      updateTimers(data.whiteTime, data.blackTime, data.turn, data.isUnlimited);
    });

    socket.on('gameOver', (msg) => { showToast(msg, 'warning'); });
    socket.on('drawOffered', () => {
      if (confirm('Rakibiniz beraberlik teklif etti. Kabul ediyor musunuz?')) {
        socket.emit('acceptDraw');
      }
    });

    function offerDraw() { socket.emit('offerDraw'); showToast('Beraberlik teklifi iletildi.', 'info'); }
    function resignGame() { if (confirm('Pes etmek istiyor musunuz?')) socket.emit('resign'); }
    function restartGame() { socket.emit('requestRestart'); }

    function copyPGN() { navigator.clipboard.writeText(currentPGN); showToast('PGN Kopyalandı!', 'success'); }
    function copyFEN() { navigator.clipboard.writeText(game.fen()); showToast('FEN Kopyalandı!', 'success'); }

    function updateTimers(wTime, bTime, turn, isUnlimited) {
      const topTimer = document.getElementById('top-timer');
      const bottomTimer = document.getElementById('bottom-timer');
      const topCard = document.getElementById('top-player-card');
      const bottomCard = document.getElementById('bottom-player-card');

      if (isUnlimited) {
        topTimer.innerText = '♾️';
        bottomTimer.innerText = '♾️';
      } else {
        if (myRole === 'b') {
          topTimer.innerText = formatTime(wTime);
          bottomTimer.innerText = formatTime(bTime);
        } else {
          topTimer.innerText = formatTime(bTime);
          bottomTimer.innerText = formatTime(wTime);
        }
      }

      const isMyTurn = (turn === 'w' && myRole === 'w') || (turn === 'b' && myRole === 'b');
      bottomCard.classList.toggle('active', isMyTurn);
      topCard.classList.toggle('active', !isMyTurn);
    }

    function formatTime(s) {
      const m = Math.floor(s / 60); const sec = s % 60;
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function updateHistory() {
      const history = game.history();
      document.getElementById('move-count').innerText = history.length;
      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        html += `<div>${Math.floor(i/2) + 1}. ${history[i]} ${history[i+1] || ''}</div>`;
      }
      const list = document.getElementById('history-list');
      list.innerHTML = html; list.scrollTop = list.scrollHeight;
    }

    function initBoard() {
      if (board) return;
      board = Chessboard('board', {
        draggable: false, position: 'start', orientation: myRole === 'b' ? 'black' : 'white', pieceTheme: pieceTheme
      });
      $('#board').on('click', '.square-55d63', function () {
        handleSquareClick($(this).attr('data-square'));
      });
    }
  </script>
</body>
</html>
